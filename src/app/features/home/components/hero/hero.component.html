<section class="hero-section">
  <!-- Background Image with CSS Slow Zoom & Dark Gradient Overlay -->
  <div class="hero-background"></div>
  <div class="hero-overlay"></div>

  <!-- Hero Main Content -->
  <div class="hero-container">
    <div class="hero-content">
      <div class="eyebrow-badge">
        <span class="leaf-dot">🍃</span>
        <span>100% Organic Assam Tea</span>
      </div>

      <h1 class="hero-title">
        <span class="hinglish-text">Har Subah, Har Chai</span>
        <span class="title-sub">Chai That Feels Like Home</span>
      </h1>

      <p class="hero-description">
        Sourced directly from lush Assam tea gardens to deliver pure, rich aroma and honest taste to every Indian kitchen — every single morning.
      </p>

      <div class="hero-ctas">
        <button class="btn btn-primary" (click)="scrollToProducts()">
          <span>Explore Our Tea</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <polyline points="19 12 12 19 5 12"/>
          </svg>
        </button>

        <button class="btn btn-ghost" (click)="onStoryClick()">
          <span>Our Story</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Scroll Down Indicator -->
  <div class="scroll-indicator" (click)="scrollToProducts()">
    <span class="scroll-text">Scroll to explore</span>
    <div class="mouse-icon">
      <div class="wheel"></div>
    </div>
  </div>
</section>
