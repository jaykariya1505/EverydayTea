<div class="logo-container" [ngClass]="['size-' + size, 'variant-' + variant]">
  <div class="logo-main">
    <div class="leaf-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Main tea leaf with center vein & steam accent -->
        <path d="M12 2C6.5 2 3 7 3 13.5C3 18.5 7 21.5 12 22C17 21.5 21 18.5 21 13.5C21 7 17.5 2 12 2Z" fill="currentColor" opacity="0.9"/>
        <path d="M12 22V6C12 6 15 10 17 12" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
        <path d="M12 11C10 13 8 14.5 8 14.5" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
      </svg>
    </div>
    
    <div class="text-wrapper">
      <span class="brand-name">
        <span class="every">Every</span><span class="day">Day</span>
        <span class="tea-tag">TEA</span>
      </span>
      <span *ngIf="variant === 'gold'" class="gold-badge">GOLD</span>
    </div>
  </div>

  <div *ngIf="showTagline" class="sub-tagline">
    Har Subah, Har Chai
  </div>
</div>
